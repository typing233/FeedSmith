selectors:
  item: ".story"
  fields:
    title: ".story_liner .link a"
    link: ".story_liner .link a | href"
    description: ".story_liner .link a"
    author: ".byline a[href^='/u/']"
    category: ".tags a"
    pubDate: ".byline span[title]| title"
