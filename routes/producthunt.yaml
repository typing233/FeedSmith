name: producthunt
url: https://www.producthunt.com/
dynamic: true
waitFor: "[data-test='post-item']"
cache: 600
delay: 2000

feed:
  title: Product Hunt - Today's Products
  description: Latest products featured on Product Hunt
  link: https://www.producthunt.com
  language: en

selectors:
  item: "[data-test='post-item']"
  fields:
    title: "a[data-test='post-name'] strong"
    link: "a[data-test='post-name'] | href"
    description: "a[data-test='post-tagline']"
